faq:
  - question: Do paid plans change the underlying numbers?
    answer: No. Every tier uses the same governed definitions, QA pins and suppression policy.
  - question: Can I buy the full filing corpus online?
    answer: Full-corpus licences are manually scoped so permitted use, delivery and retention terms are explicit.
  - question: Is a payment card required?
    answer: No. Paid access is activated against an agreed invoice and licence term.

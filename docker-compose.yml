services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brsrlens}
      POSTGRES_USER: ${POSTGRES_USER:-brsrlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brsrlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    volumes:
      - ./api:/app/api
      # The documented publish/rebuild commands run `python -m worker...` in this container,
      # so it needs current worker code rather than the copy baked into the image.
      - ./worker:/app/worker
      - ./prompts:/app/prompts:ro
      - ./taxonomy:/app/taxonomy:ro
      # Single-file bind mounts pin an inode, so an editor that replaces the file will not
      # propagate. Restart the service after editing these two.
      - ./scoring.yaml:/app/scoring.yaml:ro
      - ./plans.yaml:/app/plans.yaml:ro
      - ./events.yaml:/app/events.yaml:ro
      - ./.data:/app/.data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: celery -A worker.celery_app:celery_app worker --loglevel=INFO
    env_file: .env
    volumes:
      - ./api:/app/api
      - ./worker:/app/worker
      - ./prompts:/app/prompts:ro
      - ./taxonomy:/app/taxonomy:ro
      - ./scoring.yaml:/app/scoring.yaml:ro
      - ./plans.yaml:/app/plans.yaml:ro
      - ./events.yaml:/app/events.yaml:ro
      - ./.data:/app/.data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: celery -A worker.celery_app:celery_app beat --loglevel=INFO
    env_file: .env
    volumes:
      - ./api:/app/api
      - ./worker:/app/worker
      - ./prompts:/app/prompts:ro
      - ./taxonomy:/app/taxonomy:ro
      - ./scoring.yaml:/app/scoring.yaml:ro
      - ./plans.yaml:/app/plans.yaml:ro
      - ./events.yaml:/app/events.yaml:ro
      - ./.data:/app/.data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  frontend_node_modules:

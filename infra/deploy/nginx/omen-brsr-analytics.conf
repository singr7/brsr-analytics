# Drop on omen at /etc/nginx/sites-available/brsr-analytics.radpretation.ai
# and symlink into sites-enabled. Uses the shared certificate already on omen.
#
# Replace ALIENWARE_IP with the alienware box's address on the omen<->alienware
# link, and the ssl_certificate paths with the shared cert's real paths.

# Cloudflare puts the visitor in CF-Connecting-IP. Appending to X-Forwarded-For
# instead would leave a Cloudflare address as the rightmost untrusted hop, so the
# alienware edge would meter every visitor into one rate-limit bucket and match
# the /api/admin/ allowlist against Cloudflare rather than against the caller.
# Falls back to the peer address when the request did not come through Cloudflare.
map $http_cf_connecting_ip $brsr_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

upstream brsr_analytics {
    server ALIENWARE_IP:18080 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name brsr-analytics.radpretation.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brsr-analytics.radpretation.ai;

    ssl_certificate     /etc/letsencrypt/live/radpretation.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radpretation.ai/privkey.pem;

    # Uploads: the app caps at 50MB (filings) / 25MB (studio); this is the
    # transport ceiling and must not be lower than the alienware edge's 100m.
    client_max_body_size 100m;
    client_body_timeout  120s;

    access_log /var/log/nginx/brsr-analytics.access.log;
    error_log  /var/log/nginx/brsr-analytics.error.log;

    location / {
        proxy_pass http://brsr_analytics;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $brsr_client_ip;
        # Set, not appended: the alienware edge reads the rightmost entry.
        proxy_set_header X-Forwarded-For   $brsr_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        # Studio and analysis uploads run long; the alienware edge allows 300s.
        proxy_read_timeout    300s;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}

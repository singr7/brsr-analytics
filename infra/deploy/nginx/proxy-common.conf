# Shared upstream settings for every proxied location.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
# proxy_read_timeout is deliberately absent: the slow paths (/api/nlq, uploads)
# raise it per location, and setting it here too would put two of the same
# directive in one context, which nginx rejects with "directive is duplicate".
# The server block carries the default instead, so locations inherit and may
# override it.

# Uvicorn runs behind --proxy-headers, so it reconstructs the public scheme and
# host from the values above rather than from its own bind address.
proxy_redirect off;

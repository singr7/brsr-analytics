version: "0.2.0-provisional"
source: nse_brsr
evidence_url: https://www.nseindia.com/static/companies-listing/xbrl-information
selection_strategy: current_fy_dcy_main

# Turnover reporting scale.
#
# NSE BRSR instances report `Turnover` against the single `INR` unit token at inconsistent
# scales. The reporting scale CANNOT be recovered from the instance document:
#   - the unit token is `INR` for every issuer regardless of scale;
#   - the XBRL `decimals` attribute is a precision claim, not a scale factor. Observed FY25:
#     Coal India decimals="2" value 143368.92 (crore), Dr. Reddy's decimals="0" value 231154
#     (million), Infosys decimals="2" value 1289330074464.23 (absolute INR). Precision and
#     scale are independent, so `decimals` cannot disambiguate.
#
# An earlier build inferred scale from magnitude. That is unsound: Coal India (crore) and
# Dr. Reddy's (million) both fall in the 100,000–1,000,000,000 band, so no threshold separates
# them, and Coal India's turnover was published 10x low. Scale is therefore resolved from an
# explicit per-issuer registry. Issuers in the ambiguous band without a registry entry are NOT
# published: turnover is skipped and every turnover-normalized intensity is withheld for them.
turnover_scale:
  # At or above this value, a crore or million reading would imply an economically impossible
  # turnover, so the figure is unambiguously already absolute INR.
  absolute_threshold: 1000000000
  factors: {inr: 1, lakh: 100000, million: 1000000, crore: 10000000}
  issuers:
    COALINDIA:
      scale: crore
      confidence: 0.90
      evidence: FY25 reported value 143368.92 corresponds to revenue from operations of about INR 1.43 lakh crore; the million reading would imply about INR 14,337 crore, an order of magnitude below the filed financials.
    DRREDDY:
      scale: million
      confidence: 0.85
      evidence: FY25 reported value 231154 corresponds to about INR 23,115 crore; the crore reading would imply about INR 2.31 lakh crore, far above the filed financials.
    EICHERMOT:
      scale: crore
      confidence: 0.90
      evidence: FY25 reported value 18451.46 corresponds to about INR 18,451 crore, consistent with the filed financials; the million reading would imply about INR 1,845 crore.
    HINDUNILVR:
      scale: crore
      confidence: 0.90
      evidence: FY25 reported value 61517 corresponds to about INR 61,517 crore, consistent with the filed financials; the million reading would imply about INR 6,152 crore.
    JIOFIN:
      scale: crore
      confidence: 0.70
      evidence: FY25 reported value 805.56 read as crore gives about INR 806 crore, the only reading consistent with a listed NBFC of this size; the million reading would imply about INR 81 crore and the lakh reading less still. Lower confidence than the rest of this registry because the figure is small enough that standalone-versus-consolidated boundary also matters — flag for domain review before citing JIOFIN intensities.

mappings:
  - source_concept: Turnover
    field_key: a.basics.turnover_inr
    target_unit: INR
    confidence: 0.75
    value_strategy: registered_turnover_scale
    unit_rules: {INR: 1}
    rationale: Turnover is required for comparable intensity metrics; the current NSE cohort mixes absolute INR with crore- and million-scaled values under the same INR token.
    assumption: Values at or above the absolute threshold are already absolute INR. Below it, scale comes from the reviewed per-issuer `turnover_scale.issuers` registry; an unregistered issuer is withheld rather than guessed, so its turnover-normalized intensities do not publish.

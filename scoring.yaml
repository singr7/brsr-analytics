method_version: "1.1.0-provisional-nse"
minimum_sector_size: 5

completeness:
  # Core indicators carry twice the weight because they are the SEBI BRSR Core baseline.
  core_weight: 2.0
  # Every remaining Essential indicator still contributes to disclosure completeness.
  essential_weight: 1.0

substance:
  # Concrete quantities are the strongest evidence that narrative goes beyond policy prose.
  quantified_target_weight: 0.35
  dated_commitment_weight: 0.25
  named_methodology_weight: 0.20
  corpus_originality_weight: 0.20
  boilerplate_company_threshold: 3
  phrase_words: 8

assurance_readiness:
  # External assurance, Core coverage, and auditable lineage are independently explainable.
  assurance_status_weight: 0.40
  core_coverage_weight: 0.35
  lineage_quality_weight: 0.25

# Arithmetic identities the disclosure asserts about itself. A component reported at a
# different scale from its total breaks these, which is the failure mode that unit and scale
# mistakes actually produce. A metric that fails is withheld from materialization, along with
# everything derived from it, rather than published.
#
# Intentionally no emissions-per-energy band: Scope 1 legitimately includes non-energy
# fugitive and process emissions, so such a band would encode a rule that is not true.
plausibility_screens:
  tolerance: 0.01
  identities:
    - total: p6.e1.energy_total_gj
      parts: [p6.e1.energy_renewable_gj, p6.e1.energy_nonrenewable_gj]
    - total: p6.e2.water_total_kl
      parts:
        - p6.e2.water_surface_kl
        - p6.e2.water_ground_kl
        - p6.e2.water_third_party_kl
        - p6.e2.water_seawater_kl
        - p6.e2.water_other_kl
  non_negative:
    - a.basics.turnover_inr
    - p6.e1.energy_total_gj
    - p6.e2.water_total_kl
    - p6.e3.scope1_tco2e
    - p6.e3.scope2_tco2e

additive_metrics:
  - metric_key: p6.e3.scope12_total_tco2e
    addends: [p6.e3.scope1_tco2e, p6.e3.scope2_tco2e]

derived_metrics:
  - metric_key: normalized.energy_gj_per_inr_crore
    numerator: p6.e1.energy_total_gj
    denominator: a.basics.turnover_inr
    denominator_scale: 10000000
  - metric_key: normalized.water_kl_per_inr_crore
    numerator: p6.e2.water_total_kl
    denominator: a.basics.turnover_inr
    denominator_scale: 10000000
  - metric_key: normalized.scope12_tco2e_per_inr_crore
    numerators: [p6.e3.scope1_tco2e, p6.e3.scope2_tco2e]
    denominator: a.basics.turnover_inr
    denominator_scale: 10000000
